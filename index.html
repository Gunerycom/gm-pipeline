<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  
  <title>GUNERY × Grupo Médico — Video Marketing Pipeline & Portal</title>
  <meta name="description" content="Portal de Producción, Cronograma, Teleprompter y Aprobaciones de Video Marketing para Grupo Médico & Odontológico y Gunery Creative Agency." />

  <!-- Icons -->
  <link rel="icon" type="image/png" href="G only.png" />
  <link rel="apple-touch-icon" href="grupomedico-logo-mini.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/mobile-app.css" />
</head>
<body>

  <!-- Sticky Top Header & Role Selector -->
  <header id="app-header" class="app-header"></header>

  <!-- Main Application Container -->
  <main class="app-container">
    <!-- Views Switcher & Search Bar -->
    <div id="views-toolbar" class="views-toolbar"></div>

    <!-- Active View Area (Pipeline / Timeline / Calendar / Prompter / Reviews) -->
    <div id="main-view-container"></div>

    <!-- What's Next, Upcomings & Stats Section (Down) -->
    <div id="whats-next-container"></div>

    <div id="stats-container"></div>
  </main>

  <!-- Mobile Bottom Navigation Bar (App Experience) -->
  <nav id="mobile-bottom-nav" class="mobile-bottom-nav"></nav>

  <!-- Deep-Dive Modal Drawer (Script, Prompter, Audio Recorder, Comments) -->
  <div id="video-modal" class="modal-overlay" role="dialog" aria-modal="true"></div>

  <!-- Corporate Footer -->
  <footer class="app-footer">
    <div class="footer-logos">
      <img src="grupomedico-logo-mini.png" alt="Grupo Médico" class="footer-logo-gm" />
      <span style="opacity: 0.35;">×</span>
      <img src="Gunery Company Logo mail.png" alt="Gunery" class="footer-logo-gg" />
    </div>
    <p><strong>GUNERY × Grupo Médico & Odontológico</strong> — Video Marketing Campaign 2026.</p>
    <p style="font-size: 0.75rem;">Diseñado para Dr. Mario Pinilla y el equipo de producción. Montería, Colombia.</p>
  </footer>

  <!-- Application Logic -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
